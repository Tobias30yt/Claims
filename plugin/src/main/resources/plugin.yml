name: Claims
version: 1.5.1
main: de.tobias30.claims.ClaimsPlugin
api-version: '26.3'
softdepend: [WorldGuard]
author: Tobias30
description: Chunk protection, homes and optional native Fabric menus.
commands:
  claim:
    description: Claim the current chunk
    permission: claims.use
  unclaim:
    description: Release the current chunk (confirmation menu)
    permission: claims.use
  claims:
    description: Manage claims, trust, menus and administration
    permission: claims.use
  homes:
    description: Open your homes or teleport to one by name
    usage: /homes [name]
    permission: claims.use
  home:
    description: Open your homes or teleport to one by name
    usage: /home [name]
    permission: claims.use
  sethome:
    description: Save a named home
    permission: claims.use
  delhome:
    description: Delete a home (confirmation menu)
    permission: claims.use
  tpa:
    description: Request to teleport to a player
    usage: /tpa <player>
    permission: claims.use
  tpahere:
    description: Request a player to teleport to you
    usage: /tpahere <player>
    permission: claims.use
  tpaccept:
    description: Accept the latest incoming teleport request
    permission: claims.use
  tpdeny:
    description: Deny the latest incoming teleport request
    permission: claims.use
  tpcancel:
    description: Cancel your teleport request or warmup
    permission: claims.use
permissions:
  claims.use:
    default: true
  claims.admin:
    default: op
  claims.bypass:
    description: Bypass player interaction protection (not explosions or limits)
    default: false
  claims.homes.unlimited:
    default: false
  claims.claims.unlimited:
    default: false
